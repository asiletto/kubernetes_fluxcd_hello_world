---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.13.x"  # Lock to 1.13.x series
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Install CRDs with the chart
    installCRDs: true

    # Global settings
    global:
      leaderElection:
        namespace: cert-manager

    # Prometheus monitoring (optional, can be enabled later)
    prometheus:
      enabled: false

    # Webhook configuration
    webhook:
      enabled: true

    # Cainjector configuration
    cainjector:
      enabled: true

    # Startupapicheck (validates CRDs are installed)
    startupapicheck:
      enabled: true
      timeout: 5m

    # Resource limits
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
