---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Let's Encrypt Staging Server (for testing, no rate limits)
    # Certificates issued by this server are NOT trusted by browsers
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # Email for Let's Encrypt notifications
    # IMPORTANT: Update this with your actual email
    email: your-email@example.com

    # Secret to store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging

    # DNS-01 challenge configuration
    # Required for private IPs (HTTP-01 would fail)
    solvers:
    - dns01:
        cloudflare:
          # Email is not required with API tokens
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
          - '300510300.xyz'
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt Production Server
    # Certificates issued by this server ARE trusted by browsers
    # Rate limited: 50 certificates per week per domain
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email for Let's Encrypt notifications
    # IMPORTANT: Update this with your actual email before using production
    email: alessandro.siletto@gmail.com

    # Secret to store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod

    # DNS-01 challenge configuration
    # Required for private IPs (HTTP-01 would fail)
    solvers:
    - dns01:
        cloudflare:
          # Email is not required with API tokens
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
          - '300510300.xyz'
