---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.11.x"  # Lock to 4.11.x series (equivalent to 1.11.1 app version)
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # Resource limits (matching original deployment)
      resources:
        requests:
          cpu: 100m
          memory: 90Mi

      # Service configuration for k3s ServiceLB
      service:
        type: LoadBalancer
        externalIPs:
          - 192.168.1.100  # Static external IP

      # Security settings (matching original deployment)
      allowSnippetAnnotations: false

      # IngressClass configuration
      ingressClass: nginx
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
        controllerValue: "k8s.io/ingress-nginx"

      # Monitoring (optional, can be enabled later)
      metrics:
        enabled: false
        serviceMonitor:
          enabled: false

      # Pod security context
      podSecurityContext:
        runAsUser: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Container security context
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
        readOnlyRootFilesystem: true

      # Admission webhooks configuration
      admissionWebhooks:
        enabled: true
        patch:
          enabled: true
          podAnnotations: {}
